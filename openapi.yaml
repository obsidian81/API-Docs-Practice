openapi: 3.0.3
info:
  title: User Management API
  description: A production-ready API for managing user accounts and roles.
  version: 1.2.0

servers:
  - url: https://api.example.com/v1
    description: Primary Production Server

security:
  - BearerAuth: []

webhooks:
  userCreated:
    post:
      summary: User Created Event
      description: |
        Triggered when a new user account is successfully registered. 
        Your server should respond with `200 OK` to acknowledge receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreatedEvent'
      responses:
        '200':
          description: Event received successfully.

paths:
  /users:
    get:
      summary: List all users
      description: Retrieve a paginated list of registered users.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A paginated list of users retrieved successfully.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
        '401':
          $ref: '#/components/responses/401Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token to authorize requests.

  headers:
    X-RateLimit-Limit:
      description: The maximum number of requests allowed in the current time window.
      schema:
        type: integer
        example: 100
    X-RateLimit-Remaining:
      description: The number of remaining requests allowed within the current window.
      schema:
        type: integer
        example: 85
    X-RateLimit-Reset:
      description: The time at which the current rate limit window resets (Unix timestamp).
      schema:
        type: integer
        example: 1693000000

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number to retrieve (1-indexed).
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      description: Number of items to return per page.
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100

  responses:
    401Unauthorized:
      description: Unauthorized - Token missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "Alex Mercer"
        email:
          type: string
          format: email
          example: "alex.mercer@example.com"
        role:
          type: string
          example: "developer"

    UserCreatedEvent:
      type: object
      required:
        - id
        - event
        - timestamp
        - data
      properties:
        id:
          type: string
          format: uuid
          example: "evt_9082347109283"
        event:
          type: string
          example: "user.created"
        timestamp:
          type: string
          format: date-time
          example: "2026-08-26T12:00:00Z"
        data:
          $ref: '#/components/schemas/User'

    PaginatedUserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          properties:
            total_count:
              type: integer
              example: 150
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            has_more:
              type: boolean
              example: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: "Authentication token missing or invalid."