"""
Represents an individual user account within the system.
"""
type User {
  """
  The unique identifier for the user (UUID v4 format).
  """
  id: ID!

  """
  The full legal name of the user.
  """
  name: String!

  """
  The primary email address associated with the account.
  """
  email: String!

  """
  The role determining user permissions within the system.
  """
  role: UserRole!

  """
  A list of orders placed by this user.
  """
  orders(limit: Int = 10): [Order!]!

  """
  ISO-8601 formatted timestamp of when the user account was created.
  """
  createdAt: String!
}

"""
Defines access control levels for users.
"""
enum UserRole {
  """
  Administrative user with full system access and platform operations privileges.
  """
  ADMIN

  """
  Standard platform customer capable of placing and managing personal orders.
  """
  CUSTOMER

  """
  Developer account with access to API key management and integration tooling.
  """
  DEVELOPER
}

"""
Represents a purchase transaction made by a user.
"""
type Order {
  """
  Unique identifier for the order (UUID v4 format).
  """
  id: ID!

  """
  The current operational state of the order.
  """
  status: OrderStatus!

  """
  Total monetary value of the order in USD cents.
  """
  totalAmount: Int!

  """
  The user who placed the order.
  """
  customer: User!

  """
  ISO-8601 formatted timestamp of when the order was placed.
  """
  createdAt: String!
}

"""
Possible states for an order lifecycle.
"""
enum OrderStatus {
  """
  Order has been created but payment has not yet been processed.
  """
  PENDING

  """
  Payment confirmed; order is currently being fulfilled by warehouse operations.
  """
  PROCESSING

  """
  Order has been dispatched and is currently in transit with the carrier.
  """
  SHIPPED

  """
  Order has been successfully delivered to the customer address.
  """
  DELIVERED

  """
  Order was terminated prior to fulfillment and refunded if applicable.
  """
  CANCELLED
}

"""
Root entry point for all read queries.
"""
type Query {
  """
  Fetch a single user by their unique ID.
  """
  user(id: ID!): User

  """
  Retrieve a list of all registered users with optional pagination.
  """
  users(limit: Int = 20, offset: Int = 0): [User!]!

  """
  Fetch an order by its unique ID.
  """
  order(id: ID!): Order
}